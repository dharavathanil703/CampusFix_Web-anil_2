<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusFix — Maintenance Control System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% if session.get('user_id') %}
    <nav>
        <div>
            <h2>CF | CampusFix</h2>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="/">Dashboard</a>
            <a href="/register">Register</a>
            <a href="/tickets">All Tickets</a>
            <a href="/reports">Reports</a>
            <a href="/register" class="btn-primary">+ Report an Issue</a>
            <span style="color: #fbbf24; font-size: 0.85em; background: #334155; padding: 4px 10px; border-radius: 12px;">
                {{ session.get('username') }} ({{ session.get('role') }})
            </span>
            <a href="/logout" style="color: #f87171;">Logout</a>
        </div>
    </nav>
    {% endif %}
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
